<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tab Less</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================================================================
     HEADER — fixed greeting bar; pinned at the top, never scrolls.
     rainbow greeting on the left, byline on the right
     ================================================================ -->
<header>
  <div class="header-bar">
    <div class="header-row">
      <div class="header-left">
        <h1 id="greeting"></h1>
        <div class="date" id="dateDisplay"></div>
      </div>
      <div class="header-right" id="headerByline">created by horey</div>
    </div>
  </div>
</header>

<!-- ================================================================
     SCROLL AREA — the only scrollable region; the header stays above it
     ================================================================ -->
<div class="scroll-area">
<div class="container">

  <!-- ================================================================
       QUICK LINKS — themed shortcut chips + "Add shortcut" button
       Persisted in chrome.storage.local under the "quickLinks" key.
       ================================================================ -->
  <div class="quick-links" id="quickLinks"></div>

  <!-- ================================================================
       TAB OUT DUPES BANNER — shown when more than one Tab Less tab is open
       Background + button colored with one of the 6 themes at render time.
       ================================================================ -->
  <div class="tab-cleanup-banner" id="tabOutDupeBanner" style="display:none">
    <div class="tab-cleanup-left">
      <div class="tab-cleanup-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
        </svg>
      </div>
      <div class="tab-cleanup-text">
        You have <strong id="tabOutDupeCount"></strong> Tab Less tabs open. Keep just this one?
      </div>
    </div>
    <button class="tab-cleanup-btn" data-action="close-tabout-dupes">Close extras</button>
  </div>

  <!-- ================================================================
       OPEN TABS — domain cards arranged as a masonry/bento grid
       ================================================================ -->
  <div class="active-section" id="openTabsSection" style="display:none">
    <div class="section-header">
      <h2>Open tabs</h2>
      <div class="section-count" id="openTabsSectionCount"></div>
    </div>
    <div class="missions" id="openTabsMissions"></div>
  </div>

</div><!-- end .container -->
</div><!-- end .scroll-area -->

<!-- ================================================================
     TOAST — themed border + icon match the action's card color
     ================================================================ -->
<div class="toast" id="toast">
  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
  </svg>
  <span id="toastText"></span>
</div>

<!-- ================================================================
     ADD SHORTCUT MODAL
     ================================================================ -->
<div class="modal-backdrop" id="shortcutModal" style="display:none" data-action="close-shortcut-modal">
  <div class="modal" data-stop>
    <h2>Add Shortcut</h2>
    <form id="shortcutForm">
      <div class="form-row">
        <label for="shortcutTitle">Name</label>
        <input type="text" id="shortcutTitle" placeholder="e.g. Dribbble" required>
      </div>
      <div class="form-row">
        <label for="shortcutUrl">URL</label>
        <input type="text" id="shortcutUrl" placeholder="e.g. dribbble.com" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="modal-btn" data-action="close-shortcut-modal">Cancel</button>
        <button type="submit" class="modal-btn primary">Add Shortcut</button>
      </div>
    </form>
  </div>
</div>

<script src="config.local.js"></script>
<script src="app.js"></script>
</body>
</html>
